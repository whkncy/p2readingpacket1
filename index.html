        // Sound Effects Controller (Web Audio API)
        class SoundFX {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.enabled = true;
            }

            playCorrect() {
                if (!this.enabled) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.6);
            }

            playWrong() {
                if (!this.enabled) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.setValueAtTime(196, now + 0.15); // G3
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playStar() {
                if (!this.enabled) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.setValueAtTime(1760, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        class ReadingApp {
            constructor() {
                this.stars = parseInt(localStorage.getItem('detective_stars') || '0');

                // 記錄每個章節的星星詳細來源 { textId: { questionId: 2, bonus: 10 } }
                this.starsRecord = JSON.parse(localStorage.getItem('detective_star_record') || '{}');
                
                this.currentView = 'dashboard';
                this.currentTextId = null;
                this.activeQuestionIdx = 0;
                this.highlightedLine = null;
                this.userAnswers = {};

                // Badges State
                this.badges = [
                    { id: 'kw_hunter', name: 'Keyword Hunter', desc: 'Complete your first reading mission', icon: 'fa-crosshairs', color: 'bg-amber-500', unlocked: false, condition: 'Complete 1 Chapter' },
                    { id: 'scanner', name: 'Text Scanner', desc: 'Complete 3 reading missions', icon: 'fa-eye', color: 'bg-blue-500', unlocked: false, condition: 'Complete 3 Chapters' },
                    { id: 'context', name: 'Context Master', desc: 'Complete 5 reading missions', icon: 'fa-link', color: 'bg-emerald-500', unlocked: false, condition: 'Complete 5 Chapters' },
                    { id: 'super_det', name: 'Super Detective', desc: 'Complete all 6 reading missions', icon: 'fa-crown', color: 'bg-purple-600', unlocked: false, condition: 'Complete all 6 Chapters' }
                ];
                this.updateBadgeState();
            }

            init() {
                this.updateHeaderStats();
                this.navTo('dashboard');
            }

            updateHeaderStats() {
                document.getElementById('star-count').innerText = this.stars;
                const count = this.badges.filter(b => b.unlocked).length;
                document.getElementById('badge-count').innerText = `${count}/${this.badges.length} Badges`;
                
                localStorage.setItem('detective_stars', this.stars.toString());
                localStorage.setItem('detective_completed', JSON.stringify(this.completedTexts));
                localStorage.setItem('detective_star_record', JSON.stringify(this.starsRecord));
            }

            updateBadgeState() {
                // 改為完全重算，確保重置時也能變回 false
                this.badges[0].unlocked = this.completedTexts.length >= 1;
                this.badges[1].unlocked = this.completedTexts.length >= 3;
                this.badges[2].unlocked = this.completedTexts.length >= 5;
                this.badges[3].unlocked = this.completedTexts.length >= 6;
            }

            toggleSound() {
                sfx.enabled = !sfx.enabled;
                const icon = document.getElementById('sound-icon');
                if (sfx.enabled) {
                    icon.className = 'fa-solid fa-volume-high';
                } else {
                    icon.className = 'fa-solid fa-volume-xmark text-red-500';
                    // 🐛 FIX: 當關閉音效時，強制停止語音朗讀
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                    }
                }
            }

            navTo(view, textId = null) {
                this.currentView = view;
                this.currentTextId = textId;
                
                const existingModal = document.getElementById('completion-modal');
                if (existingModal) existingModal.remove();
                
                const infoModal = document.getElementById('info-modal');
                if (infoModal) infoModal.remove();

                const container = document.getElementById('app-container');

                if (view === 'dashboard') {
                    container.innerHTML = this.renderDashboard();
                } else if (view === 'guide') {
                    container.innerHTML = this.renderGuide();
                } else if (view === 'practice' && textId) {
                    this.activeQuestionIdx = 0;
                    this.highlightedLine = null;
                    this.userAnswers = {};
                    container.innerHTML = this.renderPracticeView(textId);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // -------------------------------------------------------------
            // STAR RECORD & RESET LOGIC
            // -------------------------------------------------------------
            
            // 全部重置功能
            resetAllStars() {
                if (!confirm('Are you sure you want to reset ALL your stars and progress? This will clear all chapters.')) {
                    return;
                }
                
                // 清空所有數據
                this.stars = 0;
                this.completedTexts = [];
                this.starsRecord = {};
                
                // 更新 UI
                this.updateBadgeState();
                this.updateHeaderStats();
                
                // 關閉彈出視窗
                const infoModal = document.getElementById('info-modal');
                if (infoModal) infoModal.remove();
                
                // 重新整理畫面
                document.getElementById('app-container').innerHTML = this.renderDashboard();
                
                // 播放音效
                sfx.playWrong();
            }

            // 答對題目時發放星星 (防重複)
            awardQuestionStars(textId, questionId) {
                if (!this.starsRecord[textId]) this.starsRecord[textId] = {};
                if (!this.starsRecord[textId][questionId]) {
                    this.starsRecord[textId][questionId] = 2;
                    this.stars += 2;
                    sfx.playStar();
                    this.updateHeaderStats();
                    return true;
                }
                return false;
            }

            // 完成章節時發放額外星星 (防重複)
            awardCompletionBonus(textId) {
                if (!this.starsRecord[textId]) this.starsRecord[textId] = {};
                if (!this.starsRecord[textId].bonus) {
                    this.starsRecord[textId].bonus = 10;
                    this.stars += 10;
                    this.updateHeaderStats();
                    return true;
                }
                return false;
            }

            // 重置單一章節
            resetChapter(textId, event) {
                if (event) event.stopPropagation();

                if (!confirm('Are you sure you want to reset this mission? Stars from this chapter will be deducted.')) {
                    return;
                }

                let deductStars = 0;
                if (this.starsRecord[textId]) {
                    Object.values(this.starsRecord[textId]).forEach(val => {
                        deductStars += val;
                    });
                    delete this.starsRecord[textId];
                }
                this.stars -= deductStars;

                this.completedTexts = this.completedTexts.filter(id => id !== textId);
                
                this.updateBadgeState();
                this.updateHeaderStats();
                document.getElementById('app-container').innerHTML = this.renderDashboard();
                
                sfx.playWrong();
            }

            // -------------------------------------------------------------

            // -------------------------------------------------------------
            renderPracticeView(textId) {
                const textData = CHAPTERS_DATA.find(t => t.id === textId);
                if (!textData) return 'Text not found.';

                const currentQ = textData.questions[this.activeQuestionIdx];

                return `
                    <div class="space-y-4">
                        <!-- Top Navigation Bar for Quiz -->

                            <button onclick="app.navTo('dashboard')" class="text-slate-600 hover:text-indigo-600 font-bold text-xs md:text-sm flex items-center space-x-1.5">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>Exit Mission</span>
                            </button>
                            <div class="text-center">
                                <span class="text-xs font-bold text-indigo-500 uppercase tracking-wider">${textData.chapter}</span>

                                    <div class="flex items-center space-x-2">
                                        <i class="fa-solid fa-book text-indigo-600"></i>
                                        <h4 class="font-bold text-slate-800 text-sm">Read Passage</h4>

                                        <i class="fa-solid fa-volume-high"></i>
                                        <span>Read Aloud</span>
                                    </button>
                                </div>

                                <!-- Text Display Area with Line Numbers -->
                                <div class="overflow-y-auto flex-grow pr-2 space-y-3 text-passage text-sm md:text-base">
                                    ${textData.lines.map(line => {
                                        const isHighlighted = this.highlightedLine === line.num;
                                        return `
                                            <div id="line-${line.num}" class="p-2 rounded-xl transition duration-300 flex items-start space-x-3 ${isHighlighted ? 'highlight-target' : 'hover:bg-slate-50'}">
                                                <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md flex-shrink-0 select-none">${line.num}</span>
                                                <div class="text-slate-800">
                                                    ${line.speaker ? `<b class="text-indigo-900">${line.speaker}:</b> ` : ''}
                                                    <span>${line.text}</span>
                                                </div>
                                            </div>

                                    }).join('')}
                                </div>

                                <div class="mt-3 pt-3 border-t border-slate-100 text-center">
                                    <span class="text-[11px] text-slate-400"><i class="fa-solid fa-info-circle mr-1"></i> Tap Detective Hints on questions to highlight lines!</span>
                                </div>
                            </div>

                            <!-- RIGHT COLUMN: QUESTION & STRATEGY PANEL (7 cols) -->
                            <div class="lg:col-span-7 bg-white rounded-3xl p-5 md:p-6 border-2 border-indigo-100 shadow-sm flex flex-col justify-between">
                                <div>
                                    <!-- Strategy Helper Bar -->
                                    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 mb-5 flex items-center justify-between">
                                        <div class="flex items-center space-x-2 text-xs font-bold text-amber-900">
                                            <i class="fa-solid fa-wand-magic-sparkles text-amber-500 text-sm"></i>
                                            <span>Detective Coach Skill:</span>
                                        </div>
                                        <button onclick="app.showDetectiveHint('${textData.id}', ${this.activeQuestionIdx})" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-xs px-3 py-1.5 rounded-xl shadow-sm transition flex items-center space-x-1">

            // Highlight Question Keywords helper
            formatPromptWithKeywords(q) {
                if (!q.keywords) return q.prompt;
                let text = q.prompt;
                q.keywords.forEach(kw => {
                    const reg = new RegExp(`(${kw})`, 'gi');
                    text = text.replace(reg, '<span class="highlight-keyword">$1</span>');
                });
                return text;
            }

            // Render interactive question inputs based on question type
            renderQuestionType(q) {
                if (q.type === 'mcq') {
                    return `
                        <div class="space-y-2.5">
                            ${q.options.map((opt, i) => `
                                <label class="flex items-center space-x-3 p-3.5 rounded-2xl border-2 border-slate-200 hover:border-indigo-400 cursor-pointer transition option-label hover:bg-slate-50">
                                    <input type="radio" name="mcq_opt" value="${opt.key}" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                                    <span class="w-7 h-7 rounded-full bg-indigo-50 text-indigo-700 font-bold text-xs flex items-center justify-center flex-shrink-0">${opt.key}</span>
                                    <span class="font-medium text-slate-800 text-sm md:text-base">${opt.text}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                }

                if (q.type === 'ordering') {
                    return `
                        <div class="space-y-3">
                            <p class="text-xs text-slate-500">Select the correct sequence order (1, 2, or 3) for each event:</p>
                            ${q.items.map((item, idx) => `
                                <div class="flex items-center justify-between p-3 rounded-2xl border-2 border-slate-200 bg-slate-50/50">
                                    <span class="font-medium text-slate-800 text-sm pr-2">${item.text}</span>
                                    <select id="ord_${idx}" data-line="${item.lineRef || ''}" onchange="app.highlightSpecificLine(this.dataset.line)" class="border-2 border-indigo-200 rounded-xl px-3 py-1.5 font-bold text-indigo-900 bg-white focus:outline-none focus:border-indigo-500 text-sm">
                                        <option value="">-</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                    </select>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                if (q.type === 'matching') {
                    return `
                        <div class="space-y-3">
                            <p class="text-xs text-slate-500">Match each location to its room code letter (A, B, C, or D):</p>
                            ${q.items.map((item, idx) => {
                                let lineNum = item.lineRef;
                                if (!lineNum && item.hint) {
                                    const match = item.hint.match(/Line\s+(\d+)/i);
                                    if (match) lineNum = match[1];
                                }
                                return `
                                <div class="flex items-center justify-between p-3 rounded-2xl border-2 border-slate-200 bg-slate-50/50">
                                    <span class="font-bold text-indigo-900 text-sm">${item.label}</span>
                                    <select id="match_${idx}" data-line="${lineNum || ''}" onchange="app.highlightSpecificLine(this.dataset.line)" class="border-2 border-indigo-200 rounded-xl px-3 py-1.5 font-bold text-indigo-900 bg-white focus:outline-none focus:border-indigo-500 text-sm">
                                        <option value="">Choose Letter</option>
                                        ${Object.keys(q.optionsMap).map(k => `<option value="${k}">${k} - ${q.optionsMap[k]}</option>`).join('')}
                                    </select>
                                </div>
                            `}).join('')}
                        </div>
                    `;
                }

                if (q.type === 'short_answer') {
                    const parts = q.template.split('[INPUT]');
                    return `
                        <div class="p-4 rounded-2xl bg-indigo-50/50 border border-indigo-100 text-slate-800 text-base font-medium space-y-3">
                            <div>
                                ${parts[0]}
                                <input type="text" id="short_ans_0" onfocus="app.highlightSpecificLine('${q.targetLine || ''}')" class="border-b-2 border-indigo-600 bg-white px-3 py-1 rounded-lg text-indigo-900 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-400 inline-block w-36 mx-1 text-center" placeholder="type word">
                                ${parts[1] || ''}
                            </div>
                        </div>
                    `;
                }

                if (q.type === 'short_answer_double') {
                    return `
                        <div class="p-4 rounded-2xl bg-indigo-50/50 border border-indigo-100 text-slate-800 text-base font-medium leading-loose">
                            ${q.template.replace('[INPUT1]', `<input type="text" id="short_ans_1" onfocus="app.highlightSpecificLine('${q.targetLine || ''}')" class="border-b-2 border-indigo-600 bg-white px-3 py-1 rounded-lg text-indigo-900 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-400 inline-block w-28 mx-1 text-center" placeholder="word 1">`).replace('[INPUT2]', `<input type="text" id="short_ans_2" onfocus="app.highlightSpecificLine('${q.targetLine || ''}')" class="border-b-2 border-indigo-600 bg-white px-3 py-1 rounded-lg text-indigo-900 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-400 inline-block w-28 mx-1 text-center" placeholder="word 2">`)}
                        </div>
                    `;
                }

                if (q.type === 'must_fill') {
                    return `
                        <div class="space-y-3">
                            ${q.items.map((item, idx) => `
                                <div class="p-3 rounded-2xl border-2 border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row sm:items-center justify-between space-y-2 sm:space-y-0">
                                    <span class="text-sm font-medium text-slate-800">${item.text}</span>
                                    <select id="must_${idx}" data-line="${item.lineRef || ''}" onchange="app.highlightSpecificLine(this.dataset.line)" class="border-2 border-indigo-200 rounded-xl px-3 py-1.5 font-bold text-indigo-900 bg-white focus:outline-none focus:border-indigo-500 text-sm">
                                        <option value="">Select word</option>
                                        <option value="must">must</option>
                                        <option value="mustn't">mustn't</option>
                                    </select>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                if (q.type === 'checkbox_matrix') {
                    return `
                        <div class="space-y-2">
                            ${q.items.map((item, idx) => `
                                <div class="p-3 rounded-2xl border-2 border-slate-200 bg-slate-50/50 flex items-center justify-between">
                                    <span class="text-sm font-medium text-slate-800">${item.action}</span>
                                    <div class="flex items-center space-x-4">
                                        <label class="inline-flex items-center cursor-pointer">
                                            <input type="radio" name="mat_${idx}" value="must" data-line="${item.lineRef || ''}" onchange="app.highlightSpecificLine(this.dataset.line)" class="w-4 h-4 text-emerald-600">
                                            <span class="ml-1.5 text-xs font-bold text-emerald-700">must</span>
                                        </label>
                                        <label class="inline-flex items-center cursor-pointer">
                                            <input type="radio" name="mat_${idx}" value="mustn't" data-line="${item.lineRef || ''}" onchange="app.highlightSpecificLine(this.dataset.line)" class="w-4 h-4 text-rose-600">
                                            <span class="ml-1.5 text-xs font-bold text-rose-700">mustn't</span>
                                        </label>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                if (q.type === 'true_false') {
                    return `
                        <div class="space-y-3">

                                <div class="p-3 rounded-2xl border-2 border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row sm:items-center justify-between space-y-2 sm:space-y-0">

                                            <span class="ml-1.5 text-xs font-bold text-emerald-700">T (True)</span>
                                        </label>
                                        <label class="inline-flex items-center px-3 py-1 rounded-xl border border-slate-300 bg-white cursor-pointer hover:bg-rose-50">
                                            <input type="radio" name="tf_${idx}" value="false" data-line="${item.lineRef || ''}" onchange="app.highlightSpecificLine(this.dataset.line)" class="w-4 h-4 text-rose-600">
                                            <span class="ml-1.5 text-xs font-bold text-rose-700">F (False)</span>
                                        </label>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                return '';
            }

            // -------------------------------------------------------------
            // DETECTIVE HELPER: HIGHLIGHTS LINE AND SHOWS COACH POPUP
            // -------------------------------------------------------------
            
            highlightSpecificLine(lineNum) {
                if (!lineNum) return;
                document.querySelectorAll('.highlight-target').forEach(el => el.classList.remove('highlight-target'));
                
                const lineElem = document.getElementById(`line-${lineNum}`);
                if (lineElem) {
                    this.highlightedLine = parseInt(lineNum); 
                    lineElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    lineElem.classList.add('highlight-target');
                }
            }

            showDetectiveHint(textId, qIdx) {
                const textData = CHAPTERS_DATA.find(t => t.id === textId);
                const q = textData.questions[qIdx];

                let linesToHighlight = [];
                if (q.targetLine) {
                    linesToHighlight.push(q.targetLine);
                }
                
                if (q.items) {
                    q.items.forEach(item => {
                        let line = item.lineRef;
                        if (!line && item.hint) {
                            const match = item.hint.match(/Line\s+(\d+)/i);
                            if (match) line = parseInt(match[1]);
                        }
                        if (line && !linesToHighlight.includes(line)) {
                            linesToHighlight.push(line);
                        }
                    });
                }

                document.querySelectorAll('.highlight-target').forEach(el => el.classList.remove('highlight-target'));

                if (linesToHighlight.length > 0) {
                    this.highlightedLine = linesToHighlight[0];
                    
                    linesToHighlight.forEach((lineNum, index) => {
                        const lineElem = document.getElementById(`line-${lineNum}`);
                        if (lineElem) {
                            lineElem.classList.add('highlight-target');
                            if (index === 0) {
                                lineElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }
                    });
                }

                const feedbackArea = document.getElementById('feedback-area');
                feedbackArea.className = 'mt-4 p-4 rounded-2xl bg-amber-50 border-2 border-amber-300 text-amber-950 text-sm animate-fade-in block';
                feedbackArea.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <i class="fa-solid fa-lightbulb text-amber-500 text-xl flex-shrink-0 mt-0.5"></i>
                        <div class="space-y-1">
                            <h5 class="font-bold text-amber-900">Detective Coach Hint:</h5>
                            <p class="text-xs text-amber-800">${q.explanation || q.tip || 'Scan the highlighted text line on the left side to locate your answer key!'}</p>
                        </div>
                    </div>
                `;
            }

            // -------------------------------------------------------------
            // CHECK ANSWER LOGIC & DETECTIVE FEEDBACK
            // -------------------------------------------------------------
            checkAnswer(textId, qIdx) {
                const textData = CHAPTERS_DATA.find(t => t.id === textId);
                const q = textData.questions[qIdx];
                let isCorrect = false;

                if (q.type === 'mcq') {
                    const selected = document.querySelector('input[name="mcq_opt"]:checked');
                    if (!selected) {
                        alert('Please select an option first!');
                        return;
                    }
                    const optKey = selected.value;
                    const opt = q.options.find(o => o.key === optKey);
                    isCorrect = opt ? opt.isCorrect : false;
                } else if (q.type === 'ordering') {
                    let matches = 0;
                    q.items.forEach((item, idx) => {
                        const val = parseInt(document.getElementById(`ord_${idx}`).value || '0');
                        if (val === item.correctOrder) matches++;
                    });
                    isCorrect = (matches === q.items.length);
                } else if (q.type === 'matching') {
                    let matches = 0;
                    q.items.forEach((item, idx) => {
                        const val = document.getElementById(`match_${idx}`).value;
                        if (val === item.correct) matches++;
                    });
                    isCorrect = (matches === q.items.length);
                } else if (q.type === 'short_answer') {
                    const val = (document.getElementById('short_ans_0').value || '').trim().toLowerCase();
                    isCorrect = q.answers.map(a => a.toLowerCase()).includes(val);
                } else if (q.type === 'short_answer_double') {
                    const val1 = (document.getElementById('short_ans_1').value || '').trim().toLowerCase();
                    const val2 = (document.getElementById('short_ans_2').value || '').trim().toLowerCase();
                    isCorrect = q.validPairs.some(pair => pair[0].toLowerCase() === val1 && pair[1].toLowerCase() === val2);
                } else if (q.type === 'must_fill') {
                    let matches = 0;
                    q.items.forEach((item, idx) => {
                        const val = document.getElementById(`must_${idx}`).value;
                        if (val === item.answer) matches++;
                    });
                    isCorrect = (matches === q.items.length);
                } else if (q.type === 'checkbox_matrix') {
                    let matches = 0;
                    q.items.forEach((item, idx) => {
                        const sel = document.querySelector(`input[name="mat_${idx}"]:checked`);
                        if (sel && sel.value === item.correct) matches++;
                    });
                    isCorrect = (matches === q.items.length);
                } else if (q.type === 'true_false') {
                    let matches = 0;
                    q.items.forEach((item, idx) => {
                        const sel = document.querySelector(`input[name="tf_${idx}"]:checked`);
                        if (sel && (sel.value === 'true') === item.answer) matches++;
                    });
                    isCorrect = (matches === q.items.length);
                }

                const feedbackArea = document.getElementById('feedback-area');
                feedbackArea.classList.remove('hidden');

                if (isCorrect) {
                    sfx.playCorrect();
                    confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
                    
                    const isNewStar = this.awardQuestionStars(textId, q.id);

                    feedbackArea.className = 'mt-4 p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-300 text-emerald-950 text-sm animate-fade-in';
                    feedbackArea.innerHTML = `
                        <div class="flex items-start space-x-3">
                            <div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-base flex-shrink-0">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <div>
                                <h5 class="font-bold text-emerald-900 text-base">Great Job, Detective! ${isNewStar ? '(+2 Stars ⭐)' : '(Already Earned ⭐)'}</h5>
                                <p class="text-xs text-emerald-800 mt-1">${q.explanation || 'You spotted the correct answer using your reading skills!'}</p>
                            </div>
                        </div>
                    `;
                } else {
                    sfx.playWrong();
                    feedbackArea.className = 'mt-4 p-4 rounded-2xl bg-rose-50 border-2 border-rose-300 text-rose-950 text-sm animate-fade-in';
                    feedbackArea.innerHTML = `
                        <div class="flex items-start space-x-3">
                            <div class="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold text-base flex-shrink-0">
                                <i class="fa-solid fa-xmark"></i>
                            </div>
                            <div>
                                <h5 class="font-bold text-rose-900 text-base">Not quite! Try Again with Detective Tip:</h5>
                                <p class="text-xs text-rose-800 mt-1">${q.explanation || 'Tap "Highlight Keywords" to locate the right clue in the passage!'}</p>
                            </div>
                        </div>
                    `;
                }
            }

            prevQuestion() {
                if (this.activeQuestionIdx > 0) {
                    this.activeQuestionIdx--;
                    this.highlightedLine = null;
                    document.getElementById('app-container').innerHTML = this.renderPracticeView(this.currentTextId);
                }
            }

            nextQuestion(textId) {
                const textData = CHAPTERS_DATA.find(t => t.id === textId);
                if (this.activeQuestionIdx < textData.questions.length - 1) {
                    this.activeQuestionIdx++;
                    this.highlightedLine = null;
                    document.getElementById('app-container').innerHTML = this.renderPracticeView(textId);
                } else {
                    // Completed text mission!
                    const isNewCompletion = !this.completedTexts.includes(textId);
                    if (isNewCompletion) {
                        this.completedTexts.push(textId);
                        this.updateBadgeState();
                        this.awardCompletionBonus(textId);
                    }
                    this.showCompletionModal(textData, isNewCompletion);
                }
            }

            // Show Text Mission Completed Popup Modal
            showCompletionModal(textData, isNewCompletion) {
                sfx.playCorrect();
                confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });

                const modalHtml = `
                    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full border-4 border-amber-300 shadow-2xl text-center space-y-5 animate-bounce-in">
                            <div class="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner">
                                <i class="fa-solid fa-trophy"></i>
                            </div>
                            <div>
                                <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Mission Accomplished!</span>
                                <h3 class="text-2xl font-extrabold text-slate-900 mt-2">${textData.title}</h3>
                                <p class="text-sm text-slate-600 mt-1">${isNewCompletion ? 'You earned +10 Bonus Stars for completing this reading mission!' : 'You have already completed this mission.'}</p>
                            </div>
                            <div class="p-3 bg-indigo-50 rounded-2xl border border-indigo-100 text-xs text-indigo-900 font-bold flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-star text-amber-500 text-base"></i>
                                <span>Total Stars: ${this.stars}</span>
                            </div>
                            <button onclick="app.navTo('dashboard')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-md transition">
                                Return to Dashboard
                            </button>
                        </div>
                    </div>
                `;
                const div = document.createElement('div');
                div.id = 'completion-modal';
                div.innerHTML = modalHtml;
                document.body.appendChild(div);
            }

            // -------------------------------------------------------------
            // WEB SPEECH API - READ ALOUD FEATURE
            // -------------------------------------------------------------
            readAloudText(textId) {
                if (!sfx.enabled) {
                    alert("Sound is muted. Please turn on the sound to use Read Aloud.");
                    return;
                }

                const textData = CHAPTERS_DATA.find(t => t.id === textId);
                if (!('speechSynthesis' in window)) {
                    alert('Text-to-speech is not supported in this browser.');
                    return;
                }

                window.speechSynthesis.cancel();

                const fullText = textData.lines.map(l => l.text).join(' ');
                const utterance = new SpeechSynthesisUtterance(fullText);
                utterance.rate = 0.85;
                utterance.pitch = 1.0;
                utterance.lang = 'en-US';

                window.speechSynthesis.speak(utterance);
            }
        }

        // Initialize Global App Instance
        let app;
        window.onload = function() {
            app = new ReadingApp();
            app.init();
        };
    </script>
</body>
</html>
